stages:
  - test
  - build

cache:
  key: node_modules
  paths:
    - node_modules/

before_script:
  - nodenv shell 11.13.0
  - yarn install

test:
  script:
    - yarn run lint
  except:
    - develop
    - staging
    - master

deploy_staging:
  stage: build # 对应stages上的job名称
  script:
    - yarn build:staging:mp-weixin
    - NODE_ENV=staging node script/upload.js
  only:
    - staging
  tags:
    - mac-shell-runner

deploy_production:
  stage: build # 对应stages上的job名称
  script:
    - yarn build:production:mp-weixin
    - NODE_ENV=production node script/upload.js
  only:
    - master
  tags:
    - mac-shell-runner
